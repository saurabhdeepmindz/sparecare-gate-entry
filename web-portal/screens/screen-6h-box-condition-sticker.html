<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Screen 6h — Box condition, printed sticker · SpareCare WMS</title>
<link rel="stylesheet" href="../../styles.css">
<script>window.SC_ASSET_BASE='../..'</script>
<script src="https://unpkg.com/lucide@0.446.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../boot.js"></script>
<script src="../../ui_kits/wms-inward/handheld/handheldAnnotations.js"></script>
<script src="../../ui_kits/wms-inward/handheld/handheldAnnotationsB2.js"></script>
<style>html,body{margin:0}body{background:var(--anno-canvas)}a{color:var(--sc-teal-deep)}a:hover{color:var(--sc-teal)}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="../../ui_kits/wms-inward/handheld/Screen6eCondition.jsx"></script><script type="text/babel">
SCBoot(['WireframeDoc','NotDrawnHost','RuggedFrame','Screen6eCondition'],function(NS){
  const {WireframeDoc,RuggedFrame,NotDrawnHost}=NS;
  const view=new URLSearchParams(location.search).get('view')==='annotated'?'annotated':'wireframe';
  const {caption,...props}=window.SC_HH_ANNO['screen-6h'];
  const RECENT=[
    {box:'BX-0005',quality:'OK',status:'\u2713',time:'09:12'},
    {box:'BX-0006',quality:'Damaged',status:'\u2715',time:'09:24'},
    {box:'BX-0007',quality:'Packing Tampered',status:'\u26A0',time:'09:28'}
  ];
  function Page(){
    const [selected,setSelected]=React.useState(['damaged']);
    const [openDelivery,setOpenDelivery]=React.useState(true);
    const [photo,setPhoto]=React.useState(true);
    const [remarks,setRemarks]=React.useState('Corner crushed and side dented.');
    return (
      <WireframeDoc mode={view} {...props} onContent legendColumns={2} gutter={30}>
        <RuggedFrame caption={caption} fit={view==='annotated'}>
          <window.Screen6eCondition variant="sticker" boxNo="BX-0006"
            selected={selected} onToggle={id=>setSelected([id])}
            openDelivery={openDelivery} setOpenDelivery={setOpenDelivery}
            photo={photo} onCapture={()=>setPhoto(p=>!p)}
            remarks={remarks} setRemarks={setRemarks} recent={RECENT}
            onSave={()=>window.dispatchEvent(new CustomEvent('sc:not-drawn',{detail:{kind:'next',title:'Save Condition',body:'Commits the assessment against this box and returns to the scanning screen. The success confirmation is specified as a green toast and is not drawn.',ref:'FR-008.7'}}))}
            onCancel={()=>window.dispatchEvent(new CustomEvent('sc:not-drawn',{detail:{kind:'info',title:'Cancel',body:'Discards the assessment for this box. Whether the scan itself is also removed is not stated \u2014 a box left in the unloaded list with no quality recorded would breach FR-007.4.',ref:'OI-083'}}))}/>
        </RuggedFrame>
      </WireframeDoc>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<React.Fragment><Page/><NotDrawnHost/></React.Fragment>);
});
</script></body></html>
