</head><body><div id="root"></div>

<script type="text/babel" src="../../ui_kits/wms-inward/handheld/Screen6fCounter.jsx"></script><script type="text/babel">
SCBoot(['WireframeDoc','NotDrawnHost','RuggedFrame','UnloadApproachPanel','Screen6fCounter'],function(NS){
  const {WireframeDoc,RuggedFrame,NotDrawnHost}=NS;
  const view=new URLSearchParams(location.search).get('view')==='annotated'?'annotated':'wireframe';
  const {caption,...props}=window.SC_HH_ANNO['screen-6f'];
  const ROWS=[
    {box:'BOX-001',quality:'Damaged',status:'\u2715'},
    {box:'BOX-004',quality:'Visible Scratch',status:'\u26A0'},
    {box:'BOX-009',quality:'Packing Tampered',status:'\u26A0'}
  ];
  function Page(){
    const [count,setCount]=React.useState(18);
    return (
      <WireframeDoc mode={view} {...props} onContent legendColumns={2} gutter={30}>
        <RuggedFrame caption={caption} fit={view==='annotated'}>
          <window.Screen6fCounter count={count} expected={28} rows={ROWS}
            onIncrement={()=>setCount(c=>c+1)}/>
        </RuggedFrame>
      </WireframeDoc>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<React.Fragment><Page/><NotDrawnHost/></React.Fragment>);
});
</script></body></html>
