SCBoot(['WireframeDoc','NotDrawnHost','RuggedFrame','Screen5aUnloadInit'],function(NS){
  const {WireframeDoc,RuggedFrame,NotDrawnHost}=NS;
  const view=new URLSearchParams(location.search).get('view')==='annotated'?'annotated':'wireframe';
  const {caption,...props}=window.SC_HH_ANNO['screen-5a'];
  function Page(){
    const [gen,setGen]=React.useState('GEN-000845');
    const [lookup,setLookup]=React.useState(false);
    return (
      <WireframeDoc mode={view} {...props} onContent legendColumns={2} gutter={30}>
        <RuggedFrame caption={caption} fit={view==='annotated'}>
          <window.Screen5aUnloadInit gen={gen} onPickGen={setGen} lookupOpen={lookup} onToggleLookup={()=>setLookup(o=>!o)}/>
        </RuggedFrame>
      </WireframeDoc>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<React.Fragment><Page/><NotDrawnHost/></React.Fragment>);
});
</script></body></html>
