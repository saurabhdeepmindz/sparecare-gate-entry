<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Screen 4a — Receipt Details · SpareCare WMS</title>
<link rel="stylesheet" href="../../styles.css">
<script>window.SC_ASSET_BASE='../..'</script>
<script src="https://unpkg.com/lucide@0.446.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../boot.js"></script>
<script src="../../ui_kits/wms-inward/handheld/handheldAnnotations.js"></script>
<style>html,body{margin:0}body{background:var(--anno-canvas)}a{color:var(--sc-teal-deep)}a:hover{color:var(--sc-teal)}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="../../ui_kits/wms-inward/handheld/Screen4aReceipt.jsx"></script><script type="text/babel">
SCBoot(['WireframeDoc','RuggedFrame','Screen4aReceipt'],function(NS){
  const {WireframeDoc,RuggedFrame}=NS;
  const view=new URLSearchParams(location.search).get('view')==='annotated'?'annotated':'wireframe';
  const {caption,...props}=window.SC_HH_ANNO['screen-4a'];

  const INVOICES=[
    {no:'INV1001',date:'11-08-2026',amount:'45,000',received:'\u2713',amountValue:45000},
    {no:'INV1002',date:'11-08-2026',amount:'52,500',received:'\u2713',amountValue:52500},
    {no:'INV1003',date:'12-08-2026',amount:'27,500',received:'\u2014',amountValue:27500}
  ];
  const SEED={docType:'GR / LR (Goods Receipt / Lorry Receipt)',docNo:'LR-77120',docDate:'12/08/2026',boxes:'50',invCount:'3'};
  function Page(){
    const [d,setD]=React.useState(view==='annotated'?SEED:{});
    const [open,setOpen]=React.useState(true);
    const set=(k,v)=>setD(p=>({...p,[k]:v}));
    return (
      <WireframeDoc mode={view} {...props} onContent legendColumns={2} gutter={30}>
        <RuggedFrame caption={caption} fit={view==='annotated'}>
          <window.Screen4aReceipt state={d} set={set} invoices={view==='annotated'?INVOICES:[]}
            openInvoice={open} onToggleInvoice={()=>setOpen(o=>!o)}/>
        </RuggedFrame>
      </WireframeDoc>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Page/>);
});
</script></body></html>
