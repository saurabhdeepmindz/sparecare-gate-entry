<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Screen 6b — Box condition · SpareCare WMS</title>
<link rel="stylesheet" href="../../styles.css">
<script>window.SC_ASSET_BASE='../..'</script>
<script src="https://unpkg.com/lucide@0.446.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../boot.js"></script>
<script src="../../ui_kits/wms-inward/handheld/handheldAnnotations.js"></script>
<style>html,body{margin:0}body{background:var(--anno-canvas)}a{color:var(--sc-teal-deep)}a:hover{color:var(--sc-teal)}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="../../ui_kits/wms-inward/handheld/Screen6bCondition.jsx"></script><script type="text/babel">
SCBoot(['WireframeDoc','RuggedFrame','Screen6bCondition'],function(NS){
  const {WireframeDoc,RuggedFrame}=NS;
  const view=new URLSearchParams(location.search).get('view')==='annotated'?'annotated':'wireframe';
  const {caption,...props}=window.SC_HH_ANNO['screen-6b'];

  const RECENT=[
    {box:'BX-00013',quality:'Packing Tampered',status:'\u26A0',time:'09:28'},
    {box:'BX-00012',quality:'Damaged',status:'\u2715',time:'09:24'},
    {box:'BX-00011',quality:'OK',status:'\u2713',time:'09:12'}
  ];
  function Page(){
    const [sel,setSel]=React.useState(['damaged']);
    const [od,setOd]=React.useState(true);
    const [photo,setPhoto]=React.useState(true);
    const [remarks,setRemarks]=React.useState('Corner crushed and side dented.');
    const toggle=id=>setSel(p=>id==='ok'?['ok']:(p.includes(id)?p.filter(x=>x!==id):[...p.filter(x=>x!=='ok'),id]));
    return (
      <WireframeDoc mode={view} {...props} onContent legendColumns={2} gutter={30}>
        <RuggedFrame caption={caption} fit={view==='annotated'}>
          <window.Screen6bCondition selected={sel} onToggle={toggle} openDelivery={od} setOpenDelivery={setOd}
            photo={photo} onCapture={()=>setPhoto(p=>!p)} remarks={remarks} setRemarks={setRemarks} recent={RECENT}/>
        </RuggedFrame>
      </WireframeDoc>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Page/>);
});
</script></body></html>
