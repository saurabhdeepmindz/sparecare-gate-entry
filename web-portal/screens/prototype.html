<style>
html,body{margin:0;height:100%}body{background:var(--anno-canvas);min-width:760px}a{color:var(--sc-teal-deep)}a:hover{color:var(--sc-teal)}
@keyframes scPulse{0%{box-shadow:0 0 0 0 rgba(90,159,163,.55)}70%{box-shadow:0 0 0 8px rgba(90,159,163,0)}100%{box-shadow:0 0 0 0 rgba(90,159,163,0)}}
.sc-stage :is(button,a[href],input,select,textarea,[role="switch"]){transition:outline-color var(--dur-fast) var(--ease-standard)}
.sc-rail button,.sc-bar button{white-space:nowrap}
.sc-hot :is(button,a[href],input,select,textarea,[role="switch"]):not([disabled]){outline:2px solid rgba(90,159,163,.8);outline-offset:2px}
.sc-hot tbody tr[style*="pointer"]{outline:2px solid rgba(90,159,163,.8);outline-offset:-2px}
.sc-flash tbody tr[style*="pointer"]{animation:scPulse 1100ms var(--ease-standard) 2}
.sc-flash :is(button,a[href],input,select,textarea,[role="switch"]):not([disabled]){animation:scPulse 1100ms var(--ease-standard) 2}
.sc-next{outline:2.5px solid var(--sc-teal-deep)!important;outline-offset:3px!important;animation:scPulse 1300ms var(--ease-standard) infinite!important}
</style>

<script type="text/babel" src="../../ui_kits/wms-inward/web/WebShell.jsx"></script>
<script type="text/babel" src="../../ui_kits/wms-inward/web/DashboardWeb.jsx"></script>

<script type="text/babel" src="../../ui_kits/wms-inward/handheld/Screen4aReceipt.jsx"></script>
<script type="text/babel" src="../../ui_kits/wms-inward/handheld/Screen6aScan.jsx"></script>
<script type="text/babel" src="../../ui_kits/wms-inward/handheld/Screen6bCondition.jsx"></script>
<script type="text/babel" src="../../ui_kits/wms-inward/handheld/Screen4bTransporter.jsx"></script>
<script type="text/babel" src="../../ui_kits/wms-inward/handheld/Screen5aUnloadInit.jsx"></script>
<script type="text/babel" src="../../ui_kits/wms-inward/handheld/Screen5bTransporterCheck.jsx"></script>

<script type="text/babel">
SCBoot(['BrowserChrome','RuggedFrame','NotDrawnHost','InfoNote','Button','Icon','WebShell','DashboardWeb','GateEntryWeb','ConsignmentWeb','Screen4aReceipt','Screen4bTransporter','Screen5aUnloadInit','Screen5bTransporterCheck','Screen6aScan','Screen6bCondition','Screen6cVariance'],function(NS){
const {BrowserChrome,RuggedFrame,NotDrawnHost,InfoNote,Button,Icon}=NS;

const STEPS=[
  {id:'dash',  surface:'web', label:'Inward Dashboard',   ref:'Screen 3',  url:'wms.sparecare.in/inward/dashboard',            next:'Create Gate Entry',      caption:null},
  {id:'gate',  surface:'web', label:'Gate Entry',         ref:'Screen 1',  url:'wms.sparecare.in/inward/gate-entry',           next:'Create Gate Entry',      caption:null},
  {id:'cons',  surface:'web', label:'Consignment Details',ref:'Screen 2',  url:'wms.sparecare.in/inward/consignment-details',  next:'Start receipt process',  caption:null},
  {id:'receipt',surface:'hh', label:'Receipt Details',    ref:'Screen 4a', url:null, next:'Next',             caption:'Screen 4a · Receipt Details'},
  {id:'transp',surface:'hh',  label:'Transporter Details',ref:'Screen 4b', url:null, next:'Next',             caption:'Screen 4b · Transporter Details'},
  {id:'init',  surface:'hh',  label:'Unload initiation',  ref:'Screen 5A', url:null, next:'Next',             caption:'Screen 5A · Unload Truck'},
  {id:'check', surface:'hh',  label:'Transporter check',  ref:'Screen 5b', url:null, next:'Start Unloading',  caption:'Screen 5b · Transporter check'},
  {id:'scan',  surface:'hh',  label:'Box scanning',       ref:'Screen 6a', url:null, next:'Finish Unload',    caption:'Screen 6a · Box scanning'},
  {id:'cond',  surface:'hh',  label:'Box condition',      ref:'Screen 6b', url:null, next:'Save Condition',   caption:'Screen 6b · Box condition'},
  {id:'var',   surface:'hh',  label:'Check Variance',     ref:'Screen 6c', url:null, next:'Proceed to Check', caption:'Screen 6c · Check Variance'}
];
const DEFAULT_STEPS=[
  {id:'unload',label:'Unload Truck & Check Primary Boxes',checked:true},
  {id:'secondary',label:'Check Secondary Boxes',checked:true},
  {id:'binning',label:'Binning',checked:true},
  {id:'receipt',label:'Receipt Confirmation',checked:true}
];
const BOX_ROWS=[
  {box:'BX-00015',quality:'Visible Scratch',status:'\u26A0',time:'09:41'},
  {box:'BX-00014',quality:'OK',status:'\u2713',time:'09:38'},
  {box:'BX-00013',quality:'Packing Tampered',status:'\u26A0',time:'09:28'},
  {box:'BX-00012',quality:'Damaged',status:'\u2715',time:'09:24'},
  {box:'BX-00011',quality:'OK',status:'\u2713',time:'09:12'}
];
const INVOICES=[
  {no:'INV1001',date:'11-08-2026',amount:'45,000',received:'\u2713',amountValue:45000},
  {no:'INV1002',date:'11-08-2026',amount:'52,500',received:'\u2713',amountValue:52500},
  {no:'INV1003',date:'12-08-2026',amount:'27,500',received:'\u2014',amountValue:27500}
];

function Rail({index,onJump}){
  return (
    <ol className="sc-rail" style={{display:'flex',flexWrap:'wrap',gap:'5px',listStyle:'none',margin:0,padding:0,justifyContent:'center',alignItems:'center'}}>
      {STEPS.map((s,i)=>{
        const done=i<index,active=i===index;
        return (
          <li key={s.id} style={{display:'flex',alignItems:'center',gap:'6px'}}>
            {i===3&&<span style={{display:'inline-flex',alignItems:'center',gap:'4px',fontSize:'var(--fs-micro)',fontFamily:'var(--font-mono)',letterSpacing:'.05em',color:'var(--sc-grey-500)',padding:'0 4px',whiteSpace:'nowrap'}}>
              <Icon name="arrow-right" size={12}/>DESK TO DOCK<Icon name="arrow-right" size={12}/>
            </span>}
            <button type="button" onClick={()=>onJump(i)}
              style={{display:'inline-flex',alignItems:'center',gap:'6px',font:'var(--type-caption)',fontWeight:'var(--fw-semibold)',padding:'5px 10px',borderRadius:'var(--r-pill)',cursor:'pointer',transition:'var(--transition-interactive)',
                border:'1px solid '+(active?'var(--sc-teal)':done?'var(--border-field)':'var(--border-default)'),
                background:active?'var(--sc-teal-deep)':done?'var(--surface-sunken)':'var(--surface-card)',
                color:active?'#fff':done?'var(--sc-teal-deep)':'var(--sc-grey-600)'}}>
              <Icon name={s.surface==='web'?'monitor':'smartphone'} size={13}/>
              <span style={{fontFamily:'var(--font-mono)',fontSize:'var(--fs-micro)',opacity:.85}}>{s.ref}</span>
              {s.label}
            </button>
          </li>
        );
      })}
    </ol>
  );
}

function FitStage({children,deps}){
  const wrap=React.useRef(null), inner=React.useRef(null);
  const [scale,setScale]=React.useState(1);
  const [box,setBox]=React.useState({w:0,h:0});
  React.useLayoutEffect(()=>{
    const measure=()=>{
      const el=inner.current, w=wrap.current; if(!el||!w) return;
      const cw=el.offsetWidth, ch=el.offsetHeight;
      if(!cw||!ch) return;
      const availW=w.clientWidth;
      const s=Math.min(1, availW/cw);
      setScale(s>0.5?s:0.5);
      setBox({w:cw,h:ch});
    };
    measure();
    const t=window.setTimeout(measure,120);
    window.addEventListener('resize',measure);
    return ()=>{window.clearTimeout(t);window.removeEventListener('resize',measure)};
  },deps);
  return (
    <div ref={wrap} style={{width:'100%',display:'flex',justifyContent:'center'}}>
      <div style={{height:box.h?box.h*scale+'px':'auto',width:box.w?box.w*scale+'px':'auto'}}>
        <div ref={inner} style={{transform:'scale('+scale+')',transformOrigin:'top left',display:'inline-block'}}>
          {children}
        </div>
      </div>
    </div>
  );
}

function App(){
  const [i,setI]=React.useState(0);
  const [hot,setHot]=React.useState(false);
  const [flash,setFlash]=React.useState(false);
  const [gen,setGen]=React.useState(null);
  const [d1,setD1]=React.useState({});
  const [d2,setD2]=React.useState({});
  const [d4,setD4]=React.useState({});
  const [invOpen,setInvOpen]=React.useState(false);
  const [invoices,setInvoices]=React.useState([]);
  const [steps,setSteps]=React.useState(DEFAULT_STEPS);
  const [queue,setQueue]=React.useState('unload');
  const [bucket,setBucket]=React.useState('Last 7 days');
  const [box,setBox]=React.useState('');
  const [rows,setRows]=React.useState(BOX_ROWS);
  const [tally,setTally]=React.useState({unloaded:18,ok:14,notOk:4});
  const [activeBox,setActiveBox]=React.useState('BX-00012');
  const [pending,setPending]=React.useState(null);
  const [d4b,setD4b]=React.useState({});
  const [d5b,setD5b]=React.useState({});
  const [invList,setInvList]=React.useState([]);
  const [unloadGen,setUnloadGen]=React.useState('GEN-000845');
  const [lookup,setLookup]=React.useState(false);
  const [plate,setPlate]=React.useState(false);
  const [transpOpen,setTranspOpen]=React.useState(true);
  const QUALITY=[{label:'Damage',count:2},{label:'Tampered Packaging',count:1},{label:'Scratch',count:1},{label:'Broken',count:0},{label:'Wrong Delivery',count:0}];

  /* Pressing the reader fills the field with the next box number, exactly as the device
     would. FR-006.2 keeps manual entry available, so the field stays editable. */
  const nextBox=()=>'BX-'+String(11+tally.unloaded-17+5).padStart(5,'0');
  const simulateScan=()=>setBox('BX-'+String(16+(tally.unloaded-18)).padStart(5,'0'));
  const recordBox=mode=>{
    const code=(box||'').trim(); if(!code) return;
    const t=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    if(mode==='check'){ setPending({code,time:t}); setActiveBox(code); setSel([]); setPhoto(false); setRemarks(''); setI(8); setBox(''); return; }
    setRows(r=>[{box:code,quality:'OK',status:'\u2713',time:t},...r]);
    setTally(v=>({unloaded:v.unloaded+1,ok:v.ok+1,notOk:v.notOk}));
    setBox('');
  };
  const [sel,setSel]=React.useState(['damaged']);
  const [od,setOd]=React.useState(true);
  const [photo,setPhoto]=React.useState(false);
  const [remarks,setRemarks]=React.useState('');
  const stage=React.useRef(null);
  const [availH,setAvailH]=React.useState(760);
  React.useLayoutEffect(()=>{
    const m=()=>{const el=stage.current;if(!el)return;setAvailH(Math.round(window.innerHeight-el.getBoundingClientRect().top-56))};
    m(); const t=window.setTimeout(m,120);
    window.addEventListener('resize',m);
    return ()=>{window.clearTimeout(t);window.removeEventListener('resize',m)};
  },[i]);

  const step=STEPS[i];
  const set1=(k,v)=>setD1(p=>({...p,[k]:v}));
  const set2=(k,v)=>setD2(p=>({...p,[k]:v}));
  const set4=(k,v)=>setD4(p=>({...p,[k]:v}));
  const ready=!!(d1.person&&d1.contact);
  const notOk=sel.some(s=>s!=='ok');

  /* Mark the next action in the flow, so hotspots suggest a path rather than
     offering a dozen equal targets. */
  React.useEffect(()=>{
    const el=stage.current; if(!el) return;
    el.querySelectorAll('.sc-next').forEach(n=>n.classList.remove('sc-next'));
    if(!(hot||flash)||!step.next) return;
    const btn=[...el.querySelectorAll('button,a[href]')].find(b=>(b.textContent||'').trim().indexOf(step.next)>-1);
    if(btn) btn.classList.add('sc-next');
  },[hot,flash,i,gen,ready,notOk,photo]);

  /* The terminal crops at the device height, so a panel further down the screen is
     invisible until scrolled. This walks the operator to it rather than leaving the
     instruction hanging. */
  const scrollTo=text=>{
    const root=stage.current; if(!root) return;
    const scroller=[...root.querySelectorAll('div')].find(d=>{
      const s=getComputedStyle(d); return (s.overflowY==='auto'||s.overflowY==='scroll')&&d.scrollHeight>d.clientHeight+20;
    });
    const target=[...root.querySelectorAll('span,div')].find(n=>(n.textContent||'').trim()===text);
    if(!scroller||!target) return;
    const delta=target.getBoundingClientRect().top-scroller.getBoundingClientRect().top;
    scroller.scrollTop=scroller.scrollTop+delta-14;
    setFlash(true); window.setTimeout(()=>setFlash(false),2300);
  };

  const onStageClick=e=>{
    if(e.target.closest('button,a[href],input,select,textarea,[role="switch"],tr')) return;
    setFlash(true); window.setTimeout(()=>setFlash(false),2300);
  };

  const reset=()=>{setI(0);setGen(null);setD1({});setD2({});setD4({});setD4b({});setD5b({});setInvoices([]);setInvList([]);setSteps(DEFAULT_STEPS);setSel(['damaged']);setPhoto(false);setRemarks('');setBox('');setRows(BOX_ROWS);setTally({unloaded:18,ok:14,notOk:4});setPending(null);setPlate(false);setLookup(false);setUnloadGen('GEN-000845');};
  const create=()=>{const n='GEN-2026-08-12-'+(Math.floor(Math.random()*9000)+1000);setGen(n);setD2(p=>({...p,gen:n,supplier:d1.supplier,courier:d1.courier}));};

  /* The terminal is 412 x 880 dp by design. Here it is sized to the window instead, so the
     whole device — including the pinned action bar — is always visible and the type stays
     full size. The caption states the real device height. */
  const deviceH=Math.max(560,Math.min(880,availH-56));
  const chrome=(child)=>step.surface==='web'
    ? <BrowserChrome url={step.url}>{child}</BrowserChrome>
    : <RuggedFrame caption={step.caption} height={deviceH} scrollHint={deviceH<880}>{child}</RuggedFrame>;

  let screen=null;
  if(step.id==='dash') screen=<window.DashboardWeb queue={queue} setQueue={setQueue} bucket={bucket} setBucket={setBucket} onCreate={()=>setI(1)}/>;
  if(step.id==='gate') screen=<window.GateEntryWeb state={d1} set={set1} gen={gen}
      onNext={()=>{ if(!gen){ if(ready) create(); } else setI(2); }} onCancel={()=>setI(0)}/>;
  if(step.id==='cons') screen=<window.ConsignmentWeb state={d2} set={set2} steps={steps} gen={gen}
      onToggle={id=>setSteps(p=>p.map(s=>s.id===id?{...s,checked:!s.checked}:s))}
      genOptions={gen?[gen]:['GEN-2025-05-20-0012']}
      onBack={()=>setI(1)} onNext={()=>setI(3)} onStepClick={n=>{ if(n===0) setI(1); }}/>;
  if(step.id==='receipt') screen=<window.Screen4aReceipt state={d4} set={set4} invoices={invoices}
      openInvoice={invOpen} onToggleInvoice={()=>setInvOpen(o=>!o)}
      onAddNext={()=>{const n=INVOICES.slice(0,invoices.length+1);setInvoices(n);setInvList(n);}}
      onBack={()=>setI(2)} onNext={()=>setI(4)}/>;
  if(step.id==='transp') screen=<window.Screen4bTransporter state={d4b} set={(k,v)=>setD4b(p=>({...p,[k]:v}))}
      invoices={invList} onReceive={r=>setInvList(l=>l.map(x=>x.no===r.no?{...x,received:x.received==='\u2713'?'\u2014':'\u2713'}:x))}
      openTransporter={transpOpen} onToggleTransporter={()=>setTranspOpen(o=>!o)}
      onBack={()=>setI(3)} onNext={()=>setI(5)}/>;
  if(step.id==='init') screen=<window.Screen5aUnloadInit gen={unloadGen} onPickGen={setUnloadGen}
      lookupOpen={lookup} onToggleLookup={()=>setLookup(o=>!o)}
      onBack={()=>setI(4)} onNext={()=>setI(6)}/>;
  if(step.id==='check') screen=<window.Screen5bTransporterCheck
      state={{transporter:d4b.transporter||'SpeedTrack Logistics',driver:d4b.driver||'Ramesh Kumar',driverPhone:d4b.driverPhone||'98xxx xxxxx',vehicleGr:d4b.vehicleGr||'KA01AB1234',...d5b}}
      set={(k,v)=>setD5b(p=>({...p,[k]:v}))} plateCaptured={plate} onCapturePlate={()=>setPlate(v=>!v)}
      onBack={()=>setI(5)} onNext={()=>setI(7)}/>;
  if(step.id==='var') screen=<window.Screen6cVariance expectedBoxes={Number(d4.boxes)||50} actualBoxes={tally.unloaded}
      expectedUnits={1240} quality={QUALITY} exceptions={tally.notOk} onBack={()=>setI(7)}/>;
  if(step.id==='scan') screen=<window.Screen6aScan box={box} setBox={setBox} rows={rows}
      onScan={simulateScan} onSubmit={recordBox}
      unloaded={tally.unloaded} expected={Number(d4.boxes)||50} ok={tally.ok} notOk={tally.notOk}
      onBoxTap={r=>{setActiveBox(r.box);setPending(null);setI(8);}} onBack={()=>setI(6)} onFinish={()=>setI(9)}/>;
  if(step.id==='cond') screen=<window.Screen6bCondition boxNo={activeBox} selected={sel}
      onToggle={id=>setSel(p=>id==='ok'?['ok']:(p.includes(id)?p.filter(x=>x!==id):[...p.filter(x=>x!=='ok'),id]))}
      openDelivery={od} setOpenDelivery={setOd} photo={photo} onCapture={()=>setPhoto(p=>!p)}
      remarks={remarks} setRemarks={setRemarks} recent={BOX_ROWS.slice(2)}
      onSave={()=>{
        const t=pending?pending.time:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
        const label=sel.length?({ok:'OK',tampered:'Packing Tampered',damaged:'Damaged',scratch:'Visible Scratch',nopack:'Without Packing',wrong:'Wrong Delivery'})[sel[0]]:'OK';
        const bad=sel.some(s=>s!=='ok');
        if(pending){
          setRows(r=>[{box:pending.code,quality:label,status:bad?'\u2715':'\u2713',time:t},...r]);
          setTally(v=>({unloaded:v.unloaded+1,ok:v.ok+(bad?0:1),notOk:v.notOk+(bad?1:0)}));
          setPending(null);
        }
        setI(7);
      }} onCancel={()=>{setPending(null);setI(7);}}/>;

  const jump=step.id==='scan'?{label:'Recent Box Entries',text:'Recent Box Entries'}
            :step.id==='transp'?{label:'the invoice summary',text:'Details of the Invoices Added'}
            :step.id==='var'?{label:'Quality Variance',text:'Quality Variance'}
            :null;
  const hint=step.id==='gate'&&!gen
    ? (ready?'Press Create Gate Entry to generate the GEN.':"Enter a driver name and contact number \u2014 they are the only mandatory fields.")
    : step.id==='scan' ? 'Press the reader to simulate a scan, then record the box as OK or send it for a condition check. Recent Box Entries is further down \u2014 tap any row to reopen its condition record.'
    : step.id==='cond' ? (notOk&&!photo?'Save is blocked until a photograph is captured \u2014 FR-006.5 requires it for any non-OK condition.':'Condition recorded. Save returns to scanning.')
    : step.id==='receipt' ? 'Open Capture Invoice Details and press Add Next a few times \u2014 the invoices carry through to the summary on the next screen.'
    : step.id==='transp' ? 'The one invoice summary table lives here. Tap a row to mark an invoice received.'
    : step.id==='init' ? 'Press Find GEN Using Other Details \u2014 it opens as a panel on this screen, not a screen of its own.'
    : step.id==='check' ? 'Change the reported vehicle number to something other than KA01AB1234 to see the mismatch warning.'
    : step.id==='var' ? 'The close of the unload. Variance is at box level only \u2014 units are counted at Consignment Check.'
    : step.id==='dash' ? 'Work starts here. Press Create Gate Entry, top right.'
    : null;

  return (
    <div style={{padding:'var(--sp-2) var(--sp-3) var(--sp-3)'}}>
      <div style={{maxWidth:'1380px',margin:'0 auto'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:'var(--sp-3)',flexWrap:'wrap',marginBottom:'var(--sp-2)'}}>
          <div style={{display:'flex',alignItems:'center',gap:'10px',minWidth:0}}>
            <span style={{fontFamily:'var(--font-mono)',fontSize:'var(--fs-micro)',fontWeight:'var(--fw-semibold)',letterSpacing:'.06em',whiteSpace:'nowrap',color:'var(--sc-teal-deep)',background:'var(--surface-sunken)',border:'1px solid var(--border-field)',borderRadius:'var(--r-sharp)',padding:'3px 8px'}}>{step.surface==='web'?'WEB SURFACE':'HANDHELD SURFACE'}</span>
            <span style={{font:'var(--type-caption)',color:'var(--sc-grey-600)'}}>{step.surface==='web'?'Desk work \u2014 no scanning (FR-032.5)':'Rugged terminal, 412 \u00d7 880 dp \u2014 scanning and physical handling (FR-032.6)'}</span>
          </div>
          <div className="sc-bar" style={{display:'flex',gap:'10px',alignItems:'center'}}>
            <button type="button" onClick={()=>setHot(h=>!h)} aria-pressed={hot}
              style={{display:'inline-flex',alignItems:'center',gap:'7px',font:'var(--type-caption)',fontWeight:'var(--fw-semibold)',padding:'7px 13px',borderRadius:'var(--r-sharp)',cursor:'pointer',transition:'var(--transition-interactive)',
                border:'1px solid '+(hot?'var(--sc-teal)':'var(--border-default)'),
                background:hot?'var(--sc-teal-deep)':'var(--surface-card)',color:hot?'#fff':'var(--sc-grey-600)'}}>
              <Icon name="mouse-pointer-click" size={14}/>{hot?'Hotspots on':'Show hotspots'}
            </button>
            <button type="button" onClick={reset}
              style={{font:'var(--type-caption)',fontWeight:'var(--fw-semibold)',padding:'7px 13px',borderRadius:'var(--r-sharp)',border:'1px solid var(--border-default)',background:'var(--surface-card)',color:'var(--sc-grey-600)',cursor:'pointer'}}>Start over</button>
          </div>
        </div>

        <div style={{marginBottom:'10px'}}><Rail index={i} onJump={setI}/></div>

        {(hint||hot)&&<div style={{maxWidth:'900px',margin:'0 auto 10px'}}>
          <InfoNote tone={step.id==='cond'&&notOk&&!photo?'warn':'info'} style={{padding:'7px 11px'}}>
            {hot?'Everything outlined is clickable. The strongest outline is the next step in the flow. ':''}{hint}
            {jump&&<button type="button" onClick={e=>{e.stopPropagation();scrollTo(jump.text);}}
              style={{marginLeft:'8px',font:'var(--type-caption)',fontWeight:'var(--fw-semibold)',padding:'3px 10px',borderRadius:'var(--r-pill)',border:'1px solid var(--sc-teal)',background:'var(--surface-card)',color:'var(--sc-teal-deep)',cursor:'pointer',whiteSpace:'nowrap'}}>
              Take me to {jump.label}
            </button>}
          </InfoNote>
        </div>}

        <div ref={stage} className={'sc-stage'+(hot?' sc-hot':'')+(flash?' sc-flash':'')} onClick={onStageClick}
          style={{cursor:hot?'default':'pointer'}}>
          <FitStage deps={[i,deviceH]}>{chrome(screen)}</FitStage>
        </div>

        <p style={{textAlign:'center',font:'var(--type-caption)',color:'var(--sc-grey-500)',marginTop:'var(--sp-2)',maxWidth:'70ch',marginLeft:'auto',marginRight:'auto',lineHeight:1.5}}>
Click anywhere on the screen to flash the clickable areas. Nothing is saved &mdash; illustrative and pre-approval, not agreed scope and not a visual design.
        </p>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<React.Fragment><App/><NotDrawnHost/></React.Fragment>);
});
</script></body></html>
