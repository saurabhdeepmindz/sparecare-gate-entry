<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.446.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<style>body{background:var(--surface-card);margin:0;padding:18px 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.lbl{font:var(--type-caption);font-weight:var(--fw-semibold);color:var(--sc-grey-500);margin-bottom:8px}.blk{margin-bottom:16px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const {ScreenHeader,Field,TextInput,SelectInput,CameraButton,GenBanner,WorkflowChecklist,KpiTile,QueueTable,ActionBar,InfoNote,Button}=window.SpareCareDesignSystem_556483;
function Card(){return (<div className="grid">

      <Field label="Name of the person" required><TextInput placeholder="Enter Person's Name"/></Field>

      <ActionBar style={{border:'1px solid var(--border-soft)'}}><Button variant="quiet" block>Cancel</Button><Button variant="accent" block>Next</Button></ActionBar></div>

  <div>

      <GenBanner gen="GEN-2025-05-20-0012"/>

      <InfoNote tone="warn">Shipment document not available.</InfoNote></div>
  </div>
