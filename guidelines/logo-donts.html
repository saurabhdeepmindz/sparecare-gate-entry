<!-- @dsCard group="Brand" viewport="700x160" name="Logo misuse" subtitle="Four things never to do to the mark" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--surface-card)}.r{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.d{border:1px solid var(--border-default);padding:14px;text-align:center;font-size:var(--fs-caption-sm);color:var(--sc-grey-500);background:var(--surface-card)}.d img{height:42px;width:auto;margin-bottom:10px;opacity:.85}.stretch img{transform:scaleX(1.6)}.recolor img{filter:sepia(1) saturate(4) hue-rotate(-30deg)}.shadow img{filter:drop-shadow(3px 6px 0 #D6336C)}.rotate img{transform:rotate(18deg)}</style>
</head><body><div class="r">
<div class="d stretch"><img src="../assets/logo-mark.png" alt="">Don't stretch or distort</div>
<div class="d recolor"><img src="../assets/logo-mark.png" alt="">Don't recolour off-palette</div>
<div class="d shadow"><img src="../assets/logo-mark.png" alt="">Don't add drop shadows</div>
<div class="d rotate"><img src="../assets/logo-mark.png" alt="">Don't rotate or tilt</div>
</div></body></html>
