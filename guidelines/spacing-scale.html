<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--surface-card)}.r{display:flex;align-items:center;gap:16px;margin-bottom:7px}.l{font:var(--type-caption);color:var(--sc-grey-500);width:130px}.b{background:var(--sc-teal);border-radius:2px;height:14px}.k{font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--sc-teal-deep);width:56px}</style>
</head><body><div class="r"><span class="k">--sp-1</span><span class="l">8 — micro</span><span class="b" style="width:8px"></span></div>
<div class="r"><span class="k">--sp-2</span><span class="l">16 — tight</span><span class="b" style="width:16px"></span></div>
<div class="r"><span class="k">--sp-3</span><span class="l">24 — default</span><span class="b" style="width:24px"></span></div>
<div class="r"><span class="k">--sp-4</span><span class="l">32 — component</span><span class="b" style="width:32px"></span></div>
<div class="r"><span class="k">--sp-5</span><span class="l">48 — section gap</span><span class="b" style="width:48px"></span></div>
<div class="r"><span class="k">--sp-6</span><span class="l">64</span><span class="b" style="width:64px"></span></div>
<div class="r"><span class="k">--sp-7</span><span class="l">96 — section pad</span><span class="b" style="width:96px"></span></div>
<div class="r"><span class="k">--sp-8</span><span class="l">128</span><span class="b" style="width:128px"></span></div></body></html>
