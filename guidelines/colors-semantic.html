<!-- @dsCard group="Colors" viewport="700x190" name="Semantic aliases" subtitle="The tokens product code should actually reference" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--surface-card)}table{width:100%;border-collapse:collapse}td{padding:5px 8px;font:var(--type-caption);border-bottom:1px solid var(--border-soft);vertical-align:middle}.k{font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--sc-teal-deep);white-space:nowrap}.v{font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--sc-grey-500)}.sw{width:26px;height:16px;border:1px solid var(--border-soft);display:inline-block}.two{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}</style>
</head><body><div class="two">
<table>
<tr><td><span class="sw" style="background:var(--text-body)"></span></td><td class="k">--text-body</td><td class="v">ink</td></tr>
<tr><td><span class="sw" style="background:var(--text-heading)"></span></td><td class="k">--text-heading</td><td class="v">deep teal</td></tr>
<tr><td><span class="sw" style="background:var(--text-muted)"></span></td><td class="k">--text-muted</td><td class="v">grey 500</td></tr>
<tr><td><span class="sw" style="background:var(--text-accent)"></span></td><td class="k">--text-accent</td><td class="v">soft teal</td></tr>
<tr><td><span class="sw" style="background:var(--surface-page)"></span></td><td class="k">--surface-page</td><td class="v">chrome</td></tr>
</table>
<table>
<tr><td><span class="sw" style="background:var(--surface-card)"></span></td><td class="k">--surface-card</td><td class="v">white</td></tr>
<tr><td><span class="sw" style="background:var(--surface-sunken)"></span></td><td class="k">--surface-sunken</td><td class="v">teal tint</td></tr>
<tr><td><span class="sw" style="background:var(--surface-inverse)"></span></td><td class="k">--surface-inverse</td><td class="v">deep teal</td></tr>
<tr><td><span class="sw" style="background:var(--action-primary)"></span></td><td class="k">--action-primary</td><td class="v">deep teal</td></tr>
<tr><td><span class="sw" style="background:var(--border-field)"></span></td><td class="k">--border-field</td><td class="v">teal line</td></tr>
</table>
</div></body></html>
