<!-- @dsCard group="Form" viewport="700x160" name="Corner radii" subtitle="Sharp for data and structure; soft pill only where a person is being told something" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--surface-card)}.g{display:flex;gap:22px;align-items:flex-end}.b{background:var(--surface-sunken);border:1px solid var(--border-field);width:104px;height:56px}.c{font:var(--type-caption);color:var(--sc-grey-500);margin-top:8px;line-height:1.4}.k{font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--sc-teal-deep);display:block}</style>
</head><body><div class="g">
<div><div class="b" style="border-radius:var(--r-sharp)"></div><div class="c"><span class="k">--r-sharp 2px</span>Buttons, cards, tables</div></div>
<div><div class="b" style="border-radius:var(--r-field)"></div><div class="c"><span class="k">--r-field 6px</span>WMS inputs, tiles, banners</div></div>
<div><div class="b" style="border-radius:var(--r-soft)"></div><div class="c"><span class="k">--r-soft 14px</span>Reserved; rarely used</div></div>
<div><div class="b" style="border-radius:var(--r-pill);width:132px;height:32px"></div><div class="c"><span class="k">--r-pill 20px</span>Status tags only</div></div>
</div></body></html>
