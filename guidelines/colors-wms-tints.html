<!-- @dsCard group="Colors" viewport="700x150" name="WMS surface tints" subtitle="Derived tints measured off the FRD wireframe artwork" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--surface-card)}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.s{border:1px solid var(--border-soft)}.f{height:44px}.i{padding:6px 8px}.n{font:var(--type-caption);font-weight:var(--fw-semibold);display:block}.h{font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--sc-grey-500)}.j{font-size:var(--fs-micro);color:var(--sc-grey-500);display:block;margin-top:3px}</style>
</head><body><div class="g">
<div class="s"><div class="f" style="background:var(--sc-teal-tint)"></div><div class="i"><span class="n">Teal tint</span><span class="h">#EAF3F3</span><span class="j">Read-only fields, info notes</span></div></div>
<div class="s"><div class="f" style="background:var(--sc-teal-line)"></div><div class="i"><span class="n">Teal line</span><span class="h">#A8C9CB</span><span class="j">Every WMS field border</span></div></div>
<div class="s"><div class="f" style="background:var(--sc-mint-row)"></div><div class="i"><span class="n">Mint row</span><span class="h">#F2F8F7</span><span class="j">Alternate queue-table rows</span></div></div>
<div class="s"><div class="f" style="background:var(--anno-canvas)"></div><div class="i"><span class="n">Anno canvas</span><span class="h">#DCDCDE</span><span class="j">Wireframe sheet ground</span></div></div>
</div></body></html>
