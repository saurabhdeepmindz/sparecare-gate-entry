<!-- @dsCard group="Spacing" viewport="700x160" name="Handheld metrics" subtitle="Rugged-terminal geometry: 390px surface, 16px safe area, 44px minimum target" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--surface-card)}.w{display:flex;gap:26px;align-items:center}.f{width:132px;height:104px;border:1px solid var(--border-soft);background:var(--surface-card);position:relative}.safe{position:absolute;inset:6px;border:1px dashed var(--sc-teal-line)}.hit{height:34px;border:1px solid var(--border-field);border-radius:var(--radius-field);margin:8px;background:var(--surface-sunken)}dl{margin:0}dt{font:var(--type-caption);font-weight:var(--fw-semibold);color:var(--text-body)}dd{margin:2px 0 12px;font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--sc-grey-600)}</style>
</head><body><div class="w">
<div class="f"><div class="safe"></div><div class="hit"></div><div class="hit"></div></div>
<dl><dt>Screen surface</dt><dd>--handheld-width: 390px</dd><dt>Safe area</dt><dd>--handheld-safe: 16px</dd></dl>
<dl><dt>Minimum target</dt><dd>--hit-min: 44px</dd><dt>Cell padding</dt><dd>--pad-cell: 12px</dd></dl>
</div></body></html>
