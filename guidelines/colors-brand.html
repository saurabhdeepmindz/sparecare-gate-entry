<!-- @dsCard group="Colors" viewport="700x170" name="Brand palette" subtitle="Six colours, six jobs — the whole brand palette" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--surface-card)}.g{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.s{border:1px solid var(--border-soft)}.f{height:56px}.i{padding:7px 8px}.n{font:var(--type-caption);font-weight:var(--fw-semibold);color:var(--text-body);display:block}.h{font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--sc-grey-500)}.j{font-size:var(--fs-micro);color:var(--sc-grey-500);display:block;margin-top:3px}</style>
</head><body><div class="g">
<div class="s"><div class="f" style="background:var(--sc-teal)"></div><div class="i"><span class="n">Soft Teal</span><span class="h">#5A9FA3</span><span class="j">Anything to notice or click</span></div></div>
<div class="s"><div class="f" style="background:var(--sc-teal-deep)"></div><div class="i"><span class="n">Deep Teal</span><span class="h">#3B616C</span><span class="j">Headlines, primary action</span></div></div>
<div class="s"><div class="f" style="background:var(--sc-graphite)"></div><div class="i"><span class="n">Stone Grey</span><span class="h">#99959B</span><span class="j">Body text, outline buttons</span></div></div>
<div class="s"><div class="f" style="background:var(--sc-chrome)"></div><div class="i"><span class="n">Cloud Grey</span><span class="h">#E5E5E6</span><span class="j">Page ground, dividers</span></div></div>
<div class="s"><div class="f" style="background:var(--sc-ink)"></div><div class="i"><span class="n">Ink Black</span><span class="h">#040101</span><span class="j">Reading text</span></div></div>
<div class="s"><div class="f" style="background:var(--sc-onyx)"></div><div class="i"><span class="n">Onyx</span><span class="h">#030000</span><span class="j">Large dark surfaces only</span></div></div>
</div></body></html>
