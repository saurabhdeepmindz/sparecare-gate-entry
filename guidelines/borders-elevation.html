<!-- @dsCard group="Form" viewport="700x170" name="Borders and elevation" subtitle="Structure is drawn with 1px lines; the brand does not use decorative shadow" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--surface-card)}.g{display:flex;gap:18px}.b{background:var(--surface-card);width:124px;height:60px}.c{font:var(--type-caption);color:var(--sc-grey-500);margin-top:8px;line-height:1.4}.k{font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--sc-teal-deep);display:block}</style>
</head><body><div class="g">
<div><div class="b" style="border:1px solid var(--border-default)"></div><div class="c"><span class="k">--border-default</span>Cards, rules, table cells</div></div>
<div><div class="b" style="border:1.5px solid var(--border-field)"></div><div class="c"><span class="k">--border-field</span>1.5px on WMS inputs</div></div>
<div><div class="b" style="border:1.5px solid var(--border-strong)"></div><div class="c"><span class="k">--border-strong</span>Search bar, outline button</div></div>
<div><div class="b" style="box-shadow:var(--shadow-card);border:1px solid var(--border-soft)"></div><div class="c"><span class="k">--shadow-card</span>KPI tiles only</div></div>
<div><div class="b" style="box-shadow:var(--shadow-raised)"></div><div class="c"><span class="k">--shadow-raised</span>Annotation markers</div></div>
</div></body></html>
