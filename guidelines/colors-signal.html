<!-- @dsCard group="Colors" viewport="700x160" name="Signal colours" subtitle="Green, amber, red — kept outside the brand palette so they read as a traffic light" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--surface-card)}.r{display:flex;gap:12px;margin-bottom:12px}.c{flex:1;border:1px solid var(--border-soft)}.f{height:34px}.i{padding:6px 8px}.n{font:var(--type-caption);font-weight:var(--fw-semibold);display:block}.h{font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--sc-grey-500)}.t{display:flex;gap:10px;align-items:center}.tag{display:inline-flex;align-items:center;gap:7px;font:var(--type-caption);font-weight:var(--fw-semibold);padding:6px 12px 6px 10px;border-radius:var(--radius-tag)}.dot{width:7px;height:7px;border-radius:50%}</style>
</head><body><div class="r">
<div class="c"><div class="f" style="background:var(--sc-green)"></div><div class="i"><span class="n" style="color:var(--sc-green)">Good — OK</span><span class="h">#4C9A6A</span></div></div>
<div class="c"><div class="f" style="background:var(--sc-amber)"></div><div class="i"><span class="n" style="color:var(--sc-amber-fg)">Careful — Low / Tampered</span><span class="h">#E2963C</span></div></div>
<div class="c"><div class="f" style="background:var(--sc-red)"></div><div class="i"><span class="n" style="color:var(--sc-red)">Stop — Out / Damaged</span><span class="h">#C1503F</span></div></div>
</div>
<div class="t">
<span class="tag" style="background:var(--status-ok-bg);color:var(--status-ok)"><span class="dot" style="background:var(--status-ok)"></span>In stock — 12 units</span>
<span class="tag" style="background:var(--status-warn-bg);color:var(--status-warn-fg)"><span class="dot" style="background:var(--status-warn)"></span>Low stock — 2 units</span>
<span class="tag" style="background:var(--status-error-bg);color:var(--status-error)"><span class="dot" style="background:var(--status-error)"></span>Out of stock</span>
</div></body></html>
