<!-- @dsCard group="Spacing" viewport="700x190" name="Spacing in use" subtitle="A card at 32px padding with 16px between fields and 24px between groups" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--surface-card)}.c{background:var(--surface-card);border:1px solid var(--border-default);padding:var(--sp-4);max-width:420px;position:relative}.t{font:var(--type-label);color:var(--text-heading);margin-bottom:var(--sp-3)}.f{margin-bottom:var(--sp-2)}.l{font:var(--type-label);display:block;margin-bottom:6px}.i{border:1px solid var(--border-field);border-radius:var(--radius-field);height:44px}.tick{position:absolute;font-family:var(--font-mono);font-size:9px;color:var(--sc-teal);background:var(--surface-sunken);padding:1px 4px}</style>
</head><body><div class="c">
<span class="tick" style="top:4px;left:4px">32 pad</span>
<div class="t">Consignment details</div>
<div class="f"><label class="l">Product Category</label><div class="i"></div></div>
<div class="f"><label class="l">Supplier Category</label><div class="i"></div><span class="tick" style="bottom:-8px;right:6px">16 gap</span></div>
<div class="f" style="margin-bottom:0"><label class="l">Supplier</label><div class="i"></div></div>
</div></body></html>
